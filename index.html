<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Precision Lab</title>
<style>
*{box-sizing:border-box}body{background:#101b1b;color:#eef9f5;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px}main{max-width:650px;margin:auto}h1{font-size:24px}p,small{color:#b5c9c2}.panel{background:#1d302c;border:1px solid #41665b;border-radius:16px;padding:16px;margin:14px 0}input{width:100%;padding:12px;border:1px solid #69897e;border-radius:10px;background:#10201c;color:white}button{display:block;width:100%;padding:16px;background:#39bb89;color:#06150f;border:0;border-radius:12px;font-size:17px;font-weight:700;margin:12px 0}button:disabled{opacity:.4}progress{width:100%;height:22px;accent-color:#39bb89}canvas,img{max-width:100%;height:auto;border-radius:10px;display:block;margin:12px auto}#preview{max-height:350px;object-fit:contain}#error{color:#ff9d9d;white-space:pre-wrap}#result{display:none}.muted{color:#a6c1b5}a{color:#88e8c1}label{display:block;margin:10px 0}select{padding:10px;background:#10201c;color:white;border-radius:8px}
</style></head><body><main><h1>Card Precision Lab</h1><p>画像を選択 → 読み込み確認 → 測定開始。写真のカードを正面に補正するには、四隅を指定してください。</p>
<div class="panel"><label>① カード画像を選択<input id="file" type="file" accept="image/*,.heic,.heif"></label><div id="selection">未選択</div><img id="preview" style="display:none" alt="選択画像"><button id="start" disabled>② 画像を読み込んで測定開始</button><div id="status">待機中</div><progress id="bar" max="100" value="0"></progress><b id="pct">0%</b><div id="error" role="alert"></div></div>
<div class="panel" id="result"><h2>③ カード四隅を指定</h2><p>画像上の四隅を「左上 → 右上 → 右下 → 左下」の順にタップしてください。赤い点を置き直す場合は「やり直す」。</p><canvas id="edit"></canvas><div id="points"></div><button id="reset">四隅をやり直す</button><button id="rectify" disabled>④ 正面に補正</button><div id="rectstatus"></div><canvas id="output"></canvas><a id="save" style="display:none" download="card_rectified.png">補正画像を保存</a></div>
<p class="muted">注意：この版は読み込みと四隅指定による透視補正を優先しています。自動フレーム認識・S/A/B判定・1mm未満の精度は未検証のため表示しません。写真の歪みや四隅指定の誤差が残る場合があります。画像処理は端末内で行い、サーバーへ送信しません。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id), file=$('file'), start=$('start'), preview=$('preview'), edit=$('edit'), output=$('output');
let chosen=null,objectURL=null,img=null,pts=[],busy=false;
function status(msg,p){$('status').textContent=msg;$('bar').value=p;$('pct').textContent=Math.round(p)+'%'}
function fail(e){$('error').textContent='エラー：'+(e?.message||String(e));status('失敗',0);busy=false;start.disabled=!chosen}
file.addEventListener('change',()=>{
 chosen=file.files&&file.files[0]||null;pts=[];img=null;start.disabled=!chosen;$('result').style.display='none';$('error').textContent='';
 if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}
 preview.style.display='none';preview.removeAttribute('src');
 if(!chosen){$('selection').textContent='未選択';status('待機中',0);return}
 $('selection').textContent='選択：'+chosen.name+' ('+(chosen.size/1048576).toFixed(2)+' MB)';
 status('画像プレビュー読み込み中',10);
 objectURL=URL.createObjectURL(chosen);
 preview.onload=()=>{preview.style.display='block';status('画像読み込み成功：'+preview.naturalWidth+'×'+preview.naturalHeight+'px。測定開始を押してください',100)};
 preview.onerror=()=>fail(new Error('この画像形式を表示できません。JPEG/PNGに変換してお試しください'));
 preview.src=objectURL;
});
function yieldUI(){return new Promise(r=>setTimeout(r,20))}
start.addEventListener('click',async()=>{
 if(!chosen||busy)return;busy=true;start.disabled=true;$('error').textContent='';
 try{
 status('画像データを読み込み中',0);
 const data=await new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onprogress=e=>{if(e.lengthComputable)status('画像データを読み込み中',Math.min(60,e.loaded/e.total*60))};
  reader.onerror=()=>reject(new Error('ファイルの読み込みに失敗'));
  reader.onload=()=>resolve(reader.result);
  reader.readAsDataURL(chosen);
 });
 status('画像を展開中',70);await yieldUI();
 img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('画像の展開に失敗'));img.src=data});
 if(!img.naturalWidth||!img.naturalHeight)throw Error('画像サイズが取得できません');
 const max=1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 edit.width=Math.round(img.naturalWidth*scale);edit.height=Math.round(img.naturalHeight*scale);
 pts=[];draw();$('result').style.display='block';status('画像読み込み完了',100);
 $('result').scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){fail(e)}finally{busy=false;start.disabled=!chosen}
});
function draw(){const c=edit.getContext('2d');c.clearRect(0,0,edit.width,edit.height);c.drawImage(img,0,0,edit.width,edit.height);c.lineWidth=3;c.strokeStyle='#ff5555';c.fillStyle='#ff5555';c.font='bold 18px sans-serif';pts.forEach((p,i)=>{c.beginPath();c.arc(p.x,p.y,7,0,Math.PI*2);c.fill();c.fillText(String(i+1),p.x+10,p.y-8)});if(pts.length===4){c.beginPath();c.moveTo(pts[0].x,pts[0].y);for(let i=1;i<4;i++)c.lineTo(pts[i].x,pts[i].y);c.closePath();c.stroke()}$('points').textContent=pts.length+'/4 点指定済み';$('rectify').disabled=pts.length!==4}
edit.addEventListener('click',e=>{if(pts.length>=4)return;const b=edit.getBoundingClientRect();pts.push({x:(e.clientX-b.left)*edit.width/b.width,y:(e.clientY-b.top)*edit.height/b.height});draw()});
$('reset').onclick=()=>{pts=[];$('rectstatus').textContent='';$('save').style.display='none';draw()};
function solve(A,b){let n=b.length;for(let i=0;i<n;i++){let k=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[k][i]))k=j;if(Math.abs(A[k][i])<1e-10)throw Error('四隅の配置が不正です');[A[i],A[k]]=[A[k],A[i]];[b[i],b[k]]=[b[k],b[i]];let z=A[i][i];for(let j=i;j<n;j++)A[i][j]/=z;b[i]/=z;for(let t=0;t<n;t++)if(t!==i){z=A[t][i];for(let j=i;j<n;j++)A[t][j]-=z*A[i][j];b[t]-=z*b[i]}}return b}
function homography(src,dst){let A=[],b=[];for(let i=0;i<4;i++){const {x,y}=src[i],u=dst[i].x,v=dst[i].y;A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return [...solve(A,b),1]}
$('rectify').onclick=async()=>{
 try{
 $('rectify').disabled=true;$('rectstatus').textContent='透視補正中…';await yieldUI();
 const W=630,H=880;output.width=W;output.height=H;
 const sc=edit.getContext('2d'),src=sc.getImageData(0,0,edit.width,edit.height);
 const h=homography([{x:0,y:0},{x:W-1,y:0},{x:W-1,y:H-1},{x:0,y:H-1}],pts);
 const dst=output.getContext('2d').createImageData(W,H),a=src.data,b=dst.data,sw=edit.width,sh=edit.height;
 for(let y=0;y<H;y++){for(let x=0;x<W;x++){const d=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/d,sy=(h[3]*x+h[4]*y+h[5])/d;
 const ix=Math.floor(sx),iy=Math.floor(sy),fx=sx-ix,fy=sy-iy,k=(y*W+x)*4;
 if(ix<0||iy<0||ix>=sw-1||iy>=sh-1){b[k+3]=0;continue}
 for(let c=0;c<3;c++){const q=(iy*sw+ix)*4+c;b[k+c]=a[q]*(1-fx)*(1-fy)+a[q+4]*fx*(1-fy)+a[q+sw*4]*(1-fx)*fy+a[q+sw*4+4]*fx*fy}b[k+3]=255
 }if(y%100===0)await yieldUI()}
 output.getContext('2d').putImageData(dst,0,0);$('save').href=output.toDataURL('image/png');$('save').style.display='block';$('rectstatus').textContent='補正完了（630×880px、63:88比率）';
 }catch(e){$('rectstatus').textContent='エラー：'+e.message}finally{$('rectify').disabled=pts.length!==4}
};
</script></body></html>
